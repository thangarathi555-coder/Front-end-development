<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Medium Image Slider</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #1e1e2f;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Slider Container */
.slider {
  width: 600px;
  height: 350px;
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

/* Image Row */
.slides {
  display: flex;
  width: 100%;
  height: 100%;
  transition: transform 0.6s ease;
}

.slides img {
  width: 600px;
  height: 350px;
  object-fit: cover;
}

/* Buttons */
.btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.5);
  color: white;
  border: none;
  padding: 8px 12px;
  font-size: 18px;
  cursor: pointer;
  border-radius: 5px;
}

.prev { left: 10px; }
.next { right: 10px; }

/* Dots */
.dots {
  position: absolute;
  bottom: 12px;
  width: 100%;
  text-align: center;
}

.dot {
  height: 10px;
  width: 10px;
  margin: 0 4px;
  display: inline-block;
  border-radius: 50%;
  background: gray;
  cursor: pointer;
}

.active {
  background: white;
}
</style>
</head>

<body>

<div class="slider">

  <div class="slides" id="slides">
    <img src="https://picsum.photos/id/1005/600/350">
    <img src="https://picsum.photos/id/1003/600/350">
    <img src="https://picsum.photos/id/1004/600/350">
    <img src="https://picsum.photos/id/1011/600/350">
  </div>

  <button class="btn prev" onclick="prevSlide()">❮</button>
  <button class="btn next" onclick="nextSlide()">❯</button>

  <div class="dots" id="dots"></div>

</div>

<script>
let index = 0;
const slides = document.getElementById("slides");
const total = slides.children.length;
const dotsContainer = document.getElementById("dots");

// create dots
for (let i = 0; i < total; i++) {
  let dot = document.createElement("span");
  dot.classList.add("dot");
  dot.onclick = () => goTo(i);
  dotsContainer.appendChild(dot);
}

const dots = document.querySelectorAll(".dot");

function update() {
  slides.style.transform = `translateX(-${index * 600}px)`;

  dots.forEach(d => d.classList.remove("active"));
  dots[index].classList.add("active");
}

function nextSlide() {
  index = (index + 1) % total;
  update();
}

function prevSlide() {
  index = (index - 1 + total) % total;
  update();
}

function goTo(i) {
  index = i;
  update();
}

// auto slide
setInterval(nextSlide, 3000);

// init
update();
</script>

</body>
</html>
